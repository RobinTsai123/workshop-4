user www-data;
worker_processes auto;
pid /run/nginx.pid;

events {
  worker_connections 768;
}

http {
  access_log /var/log/nginx/access.log;
  error_log /var/log/nginx/error.log;
  gzip on;

  upstream apps {
    least_conn;
    server 206.189.151.172:3000;
    server 206.189.151.172:3001;
    server 206.189.151.172:3002;
  }

  server {
    listen 80;
    location / {
      proxy_pass http://apps;
    }
  }
}
